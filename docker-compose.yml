services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forge-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_PATH=/data/forge.db
      - FIXTURES_PATH=/app/fixtures.json
    volumes:
      - ./fixtures.json:/app/fixtures.json:ro
      - forge-db-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: forge-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  forge-db-data:
